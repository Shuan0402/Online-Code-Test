# Step 2 / Round 2 main file — env injection, healthcheck, image-only.
# Local dev adds `build:` via docker-compose.override.yml (auto-loaded).
# CI / prod runs:
#   docker compose -f docker-compose.yml up
# to skip the override and pull the registry image instead.

services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # `$$` escapes compose's own ${VAR} substitution so the shell inside the
    # container reads $POSTGRES_USER from its own env at probe time.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: backend:dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      WORKER_SECRET: ${WORKER_SECRET}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_EXTERNAL_ENDPOINT: http://localhost:9000
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_BUCKET: octest-submissions
      MINIO_PRESIGN_EXPIRES_SEC: "600"
      PYTHONPATH: /app
      POSTGRES_HOST: pg
      REDIS_HOST: redis
      LOG_FILE_PATH: /var/log/app/backend.log
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro  
      - app_logs:/var/log/app
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # python -c probe: slim image has no curl/wget, but always has python.
    # Hits /health (liveness only — does not touch DB).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API — backend / worker use http://minio:9000 inside compose net
      - "9001:9001"   # console UI
    # /minio/health/live is always served; no curl in image so use wget via busybox
    # fallback isn't available either, but minio image ships its own /usr/bin/mc.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: judge-worker:dev
    environment:
      REDIS_URL: redis://redis:6379/0
      BACKEND_URL: http://backend:8000/api/v1
      WORKER_SECRET: ${WORKER_SECRET}
      QUEUE_PENDING: submissions:pending
      QUEUE_PROCESSING: submissions:processing
      LOG_FILE_PATH: /var/log/app/worker.log
    volumes:
      # DooD: worker uses host docker daemon to spawn sandbox sibling containers.
      # See judge-worker/Dockerfile header for the security trade-off.
      - /var/run/docker.sock:/var/run/docker.sock
      - app_logs:/var/log/app
      # Sandbox source code 用：worker 跟 sandbox sibling 都掛同一個 host 路徑，
      # 路徑名稱在容器內外一致，docker daemon 才能用同一個 host path mount 給 sandbox。
      # 對應 judge-worker/spawner/docker_spawner.py 的 sandbox_root。
      - /tmp/oct-sandbox-work:/tmp/oct-sandbox-work
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # No ports — worker is outbound-only (BLMOVE redis + POST backend).
    # No healthcheck — no HTTP endpoint exposed; rely on docker restart policy.
    restart: unless-stopped

  loki:
    image: grafana/loki:2.8.2
    user: "root"
    volumes:
      - ./infrastructure/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      # 先不要掛載，開發階段掛載會讓硬碟爆掉
      # - loki_data:/var/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q 'ready' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  promtail:
    image: grafana/promtail:2.8.2
    volumes:
      - ./infrastructure/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - app_logs:/var/log/app:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  prometheus:
    build:
      context: ./infrastructure/prometheus
      dockerfile: Dockerfile
    user: "root"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:9.5.2-ubuntu
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./infrastructure/grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./infrastructure/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - loki
      - prometheus

  mailhog:
    image: mailhog/mailhog:latest
    container_name: online-code-test-mailhog-1
    ports:
      - "1025:1025"   # SMTP 接收埠
      - "8025:8025"   # 瀏覽器 Web UI 密碼箱
    logging:
      options:
        tag: "mailhog"

  email-worker:
    build:
      context: ./email-worker
      dockerfile: Dockerfile
    container_name: online-code-test-email-worker-1
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - LOG_FILE_PATH=/var/log/app/email-worker.log
    volumes:
      - app_logs:/var/log/app
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "9005:9000"

volumes:
  pg_data:
  minio_data:
  app_logs:
  # loki_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
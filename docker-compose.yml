# Step 2 / Round 2 main file — env injection, healthcheck, image-only.
# Local dev adds `build:` via docker-compose.override.yml (auto-loaded).
# CI / prod runs:
#   docker compose -f docker-compose.yml up
# to skip the override and pull the registry image instead.

services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # `$$` escapes compose's own ${VAR} substitution so the shell inside the
    # container reads $POSTGRES_USER from its own env at probe time.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: backend:dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      WORKER_SECRET: ${WORKER_SECRET}
      PYTHONPATH: /app
      POSTGRES_HOST: pg
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    # python -c probe: slim image has no curl/wget, but always has python.
    # Hits /health (liveness only — does not touch DB).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API — backend / worker use http://minio:9000 inside compose net
      - "9001:9001"   # console UI
    # /minio/health/live is always served; no curl in image so use wget via busybox
    # fallback isn't available either, but minio image ships its own /usr/bin/mc.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: judge-worker:dev
    environment:
      REDIS_URL: redis://redis:6379/0
      BACKEND_URL: http://backend:8000
      WORKER_SECRET: ${WORKER_SECRET}
      QUEUE_PENDING: submissions:pending
      QUEUE_PROCESSING: submissions:processing
    volumes:
      # DooD: worker uses host docker daemon to spawn sandbox sibling containers.
      # See judge-worker/Dockerfile header for the security trade-off.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # No ports — worker is outbound-only (BLMOVE redis + POST backend).
    # No healthcheck — no HTTP endpoint exposed; rely on docker restart policy.
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:

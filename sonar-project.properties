sonar.projectKey=Shuan0402_Online-Code-Test
sonar.organization=shuan0402

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=Online-Code-Test
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Exclude third-party / generated directories from analysis to avoid noise
sonar.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/test-results/**,**/artifacts/**,**/coverage/**,**/htmlcov/**,**/playwright-report/**

# Coverage reports — paths are relative to repo root.
# Generated by `npm run test:coverage` (frontend) and `pytest --cov` (backend / judge-worker).
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml,judge-worker/coverage.xml

# Test code scope.
# 之前寫 sonar.tests=frontend/src 把整個 frontend 原始碼當 test，
# source 縮到 44 個檔、main scan 後 ncloc 歸零、coverage 無法 attach。
# 改成：sonar.tests 只列真正的 test 資料夾；frontend 端的 *.test.{js,jsx}
# 靠 SonarCloud 內建檔名規則自動識別。
sonar.tests=backend/tests,judge-worker/tests
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/test_*.py

# 排除 coverage 不應該算的檔（seed scripts、test setup、main.jsx 入口、test 檔本身）
sonar.coverage.exclusions=frontend/src/test/**,frontend/src/main.jsx,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,backend/app/scripts/**

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml
  sync_period: 1s

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: app-file-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: "backend-and-worker"
          __path__: /var/log/app/*.log
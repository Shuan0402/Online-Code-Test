# Single-origin reverse proxy — same host:port serves SPA + API + MinIO + Grafana
# so the browser never crosses origins → no CORS preflight, no allow_origins config.
server {
    listen 80;
    server_name _;

    # Submissions / file uploads can be large
    client_max_body_size 50M;

    # SPA static assets
    root /usr/share/nginx/html;
    index index.html;

    # Backend API (FastAPI)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # MinIO presigned URLs — bucket name is the first path segment.
    # Pass Host header through so MinIO's sigv4 verification uses the same
    # host the backend signed against (MINIO_EXTERNAL_ENDPOINT).
    location /octest-submissions/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana (sub-path mount — Grafana itself must set GF_SERVER_ROOT_URL
    # and GF_SERVER_SERVE_FROM_SUB_PATH=true)
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana live websocket
    location /grafana/api/live/ {
        proxy_pass http://grafana:3000/api/live/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback — react-router handles unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}

name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    
    env:
      # 測試用的預設值
      POSTGRES_USER: octest
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: octest
      BUILD_ENV: test
      JWT_SECRET: replace-me-with-openssl-rand-base64-32
      CANDIDATE_PASSWORD_SHA_SECRET: replace-me-with-openssl-rand-base64-32
      WORKER_SECRET: replace-me-with-openssl-rand-base64-32
      MINIO_USER: octest-admin
      MINIO_PASSWORD: changeme-minio
      GRAFANA_PASSWORD: admin
      
    steps:
      # 從 GitHub 拉取程式碼到 CI 伺服器
      - name: Checkout code
        uses: actions/checkout@v5

      # 建置 Backend Image (含網路超時重試機制)
      - name: Build backend image
        run: |
          for i in {1..3}; do
            docker build --build-arg BUILD_ENV=test -t backend:dev ./backend && break || {
              if [ $i -eq 3 ]; then
                echo "Failed to build backend image after 3 attempts."
                exit 1
              fi
              echo "Build failed due to network or registry issues. Retrying in 10 seconds ($i/3)..."
              sleep 10
            }
          done

      # 啟動依賴服務並執行測試
      - name: Run Tests with pytest
        run: |
          docker compose -f docker-compose.yml run --rm backend python -m pytest tests/
          
      # 把啟動的 DB、Redis 容器與 Volume 清理乾淨
      - name: Clean up Docker resources
        if: always()
        run: docker compose -f docker-compose.yml down -v
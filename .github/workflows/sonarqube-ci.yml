name: SonarQube CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-24.04

    env:
      # docker-compose 與 backend 測試用的預設值（與 backend-ci.yml 對齊）
      POSTGRES_USER: octest
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: octest
      BUILD_ENV: test
      JWT_SECRET: replace-me-with-openssl-rand-base64-32
      WORKER_SECRET: replace-me-with-openssl-rand-base64-32
      MINIO_USER: octest-admin
      MINIO_PASSWORD: changeme-minio
      GRAFANA_PASSWORD: admin

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # ── Frontend coverage (Vitest + v8) ────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@6012dfb26675065309e21032068981c6237f8e25 # v4.2.2
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      # ── Backend coverage (pytest + pytest-cov, in Docker) ──────────
      - name: Build backend image
        run: docker build --build-arg BUILD_ENV=test -t backend:dev ./backend

      # mount backend/ 讓 container 內產生的 coverage.xml 落到 host 路徑
      # （image 預裝的程式碼會被 host volume 覆蓋，但因為 source 一致、deps 已裝在
      # site-packages，所以不影響執行）
      - name: Run backend tests with coverage
        run: |
          docker compose -f docker-compose.yml run --rm \
            -v "$PWD/backend:/app" \
            backend python -m pytest tests/ \
              --cov=app \
              --cov-report=xml:coverage.xml \
              --cov-report=term

      - name: Clean up backend Docker resources
        if: always()
        run: docker compose -f docker-compose.yml down -v

      # ── Judge-worker coverage (pytest + fakeredis, on host) ────────
      - name: Set up Python
        uses: actions/setup-python@f67e240f6d553de3a7c6460fa770c67761066446 # v5.4.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: judge-worker/requirements-dev.txt

      - name: Install judge-worker deps
        working-directory: judge-worker
        run: |
          pip install --only-binary :all: -r requirements-dev.txt

      - name: Run judge-worker tests with coverage
        working-directory: judge-worker
        run: |
          python -m pytest tests/ \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term

      # pytest-cov 寫到 coverage.xml 的 <source> 是容器/runner cwd 的絕對路徑
      # (如 "/app/app" 或 "/home/runner/.../judge-worker")，Sonar 從 repo root 解
      # 不到。改寫成 repo-relative path 後 Sonar 才能 join filename → 找到對應
      # source 檔，否則會吐 "Cannot resolve N file paths, ignoring coverage"。
      - name: Rewrite coverage.xml source paths for Sonar
        run: |
          sed -i 's|<source>/app/app</source>|<source>backend/app</source>|' backend/coverage.xml
          sed -i 's|<source>.*judge-worker</source>|<source>judge-worker</source>|' judge-worker/coverage.xml
          echo "--- backend/coverage.xml <source> ---"
          grep -m1 '<source>' backend/coverage.xml
          echo "--- judge-worker/coverage.xml <source> ---"
          grep -m1 '<source>' judge-worker/coverage.xml

      # ── SonarCloud scan ────────────────────────────────────────────
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@fdd1ee3e2bdf2a26569ec2a8c62c2f741da8aa3d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重設您的帳號密碼</title>
</head>
<body style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; -webkit-font-smoothing: antialiased;">
    <table role="presentation" border="0" style="border-collapse: collapse; width: 100%; background-color: #f4f6f9; padding: 40px 0;">
        <tr>
            <td style="text-align: center;">
                <table role="presentation" border="0" style="border-collapse: collapse; width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden;">
                    <tr>
                        <td style="background-color: #1e3a8a; padding: 30px; text-align: center;">
                            <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: 600; letter-spacing: 1px;">Online Judge System</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px 30px; background-color: #ffffff;">
                            <p style="margin: 0 0 20px 0; font-size: 16px; color: #333333; line-height: 1.6;">
                                <strong>親愛的 {{ username }} 您好：</strong>
                            </p>
                            <p style="margin: 0 0 30px 0; font-size: 15px; color: #555555; line-height: 1.6;">
                                系統收到了您重設密碼的請求。請點擊下方按鈕以進入測驗平台設定新密碼。為了您的帳號安全，此連結將於 <strong>{{ expire_minutes }} 分鐘</strong>後失效。
                            </p>
                            
                            <table role="presentation" border="0" style="border-collapse: collapse; margin: 0 auto 30px auto;">
                                <tr>
                                    <td style="text-align: center; border-radius: 6px; background-color: #2563eb;">
                                        <a href="{{ reset_url }}" target="_blank" style="border: none; border-radius: 6px; color: #ffffff; display: inline-block; font-size: 16px; font-weight: 600; padding: 14px 28px; text-decoration: none; letter-spacing: 0.5px;">
                                            立即重設密碼
                                        </a>
                                    </td>
                                </tr>
                            </table>

                            <p style="margin: 0 0 20px 0; font-size: 14px; color: #9aa2af; line-height: 1.6; text-align: center;">
                                如果按鈕無法點擊，您也可以複製以下網址至瀏覽器開啟：<br>
                                <a href="{{ reset_url }}" target="_blank" style="color: #2563eb; text-decoration: underline; word-break: break-all;">{{ reset_url }}</a>
                            </p>
                            
                            <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 30px 0;">
                            
                            <p style="margin: 0; font-size: 13px; color: #9aa2af; line-height: 1.5;">
                                如果您並未申請重設密碼，請直接忽略本封郵件，您的密碼將保持安全，不會被變更。
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 20px 30px; background-color: #f9fafb; border-top: 1px solid #f3f4f6; text-align: center;">
                            <!-- 之後記得改 -->
                            <p style="margin: 0; font-size: 12px; color: #9aa2af;">
                                License &copy; 2026 
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
